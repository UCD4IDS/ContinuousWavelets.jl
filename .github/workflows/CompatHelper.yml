name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/compat-helper-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}